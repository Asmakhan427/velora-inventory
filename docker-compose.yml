version: "3.9"

services:
  backend:
    build:
      context: ./backend
    container_name: deimos-inventory-backend
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - NODE_ENV=production
      - JWT_SECRET=change-this-in-production
      - DB_PATH=/app/data/inventory.db
    volumes:
      - inventory-data:/app/data
    command: sh -c "npm run migrate && npm run seed:if-empty && npm run start"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
    container_name: deimos-inventory-frontend
    ports:
      - "5500:80"
    depends_on:
      - backend

volumes:
  inventory-data:
